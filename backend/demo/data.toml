# Demo account – the hand-written core. `src/demo/generate.rs` adds the loose
# acquaintances (colleagues, uni, climbing …) to the groups below.
#
# Dates are relative to the day of loading (format in `src/demo/data.rs`):
#   "-12d", "+2d 19:30", "-3w" → that day · "today-4y" → this day 4 years ago
#   "-14m" → that month · "-6y" → that year
# Birthdays: { in_days = 9, age = 32 } · { in_days = 40 } (year unknown) · { age = 24 } (year only)
# People and groups get a `key` to refer to them; `me` is the demo user.
# Money in cents from your side, like the API: -8_80 = you paid 8.80, 14_00 = they paid 14.
#
# Every case the app knows should appear somewhere: overdue and upcoming
# reconnects, focus, deceased, archived, subgroups, ranges, partial dates,
# reminders, open points with and without an activity, money owed either way,
# settled and from an activity.

[me]
